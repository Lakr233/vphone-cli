name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          xcbeautify --version

      - name: Build VPhone.bundle
        env:
          SWIFT_JOBS: "4"
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild -workspace VPhone.xcworkspace -scheme VPhone \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeBundle -jobs 4 build 2>&1 \
            | tee .build/xcodebuild.log \
            | xcbeautify --quiet --disable-logging --renderer github-actions

      # Quiet mode hides unannotated build-phase output, including the reason
      # a script phase failed. Keep the full log for that case.
      - name: Show raw build log
        if: failure()
        run: tail -n 300 .build/xcodebuild.log

      - name: Upload raw build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: .build/xcodebuild.log

      - name: Verify bundle
        run: |
          set -euo pipefail
          zsh VPhoneExecutable/VPhoneVirtualization/Build/ValidateBundle.sh \
            .build/XcodeBundle/Build/Products/Debug/VPhone.bundle

      - name: Guest component tests
        run: |
          make -C VPhoneGuestComponents test-loader-links
          make -C VPhoneGuestComponents test-vcam-dataplane
