name: website

# Builds the documentation site from Documents/ and README.md with Rspress
# (VPhoneWebsite/) and publishes it to GitHub Pages from main.

on:
  push:
    branches: [main]
    paths:
      - Documents/**
      - README.md
      - VPhoneWebsite/**
      - .github/workflows/website.yml
  pull_request:
    paths:
      - Documents/**
      - README.md
      - VPhoneWebsite/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VPhoneWebsite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VPhoneWebsite/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: VPhoneWebsite/doc_build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
