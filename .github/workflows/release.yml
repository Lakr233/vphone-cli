name: release

# Build the self-contained VPhone.bundle and attach it to a published
# GitHub Release. The Xcode scheme signs and validates the bundle.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build VPhone.bundle
        env:
          SWIFT_JOBS: "4"
        run: |
          xcodebuild -workspace VPhone.xcworkspace -scheme VPhone \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeBundle -jobs 4 build

      - name: Verify bundle
        run: |
          set -euo pipefail
          zsh VPhoneExecutable/VPhoneVirtualization/Build/ValidateBundle.sh \
            .build/XcodeBundle/Build/Products/Release/VPhone.bundle

      - name: Package bundle
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ditto -c -k --keepParent \
            .build/XcodeBundle/Build/Products/Release/VPhone.bundle \
            "VPhone-${TAG}.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "VPhone-${TAG}.zip" --clobber
