name: release

# Build the portable, signed vphone-cli.app and attach it to a published
# GitHub Release. Validate the actual application bundle; no Homebrew
# packages or separately provisioned runtime tools are required.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Init submodules
        # SwiftPM resolves code dependencies from Package.resolved.
        # insert_dylib is a test reference, not a product dependency.
        run: git submodule update --init --depth 1 scripts/resources

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build and bundle (portable .app)
        env:
          SWIFT_JOBS: "4"
        run: ./scripts/build.sh

      - name: Verify application bundle
        run: |
          set -euo pipefail
          codesign --verify --strict .build/vphone-cli.app
          test -x .build/vphone-cli.app/Contents/Resources/guest/vphoned
          zsh scripts/check_aux.sh

      - name: Package app
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ditto -c -k --keepParent .build/vphone-cli.app "vphone-cli-${TAG}.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "vphone-cli-${TAG}.zip" --clobber
